name: Android CI

on:
  push:
    branches:
      - main
      - 'a2/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Gradle Wrapper checkout
        shell: bash
        run: |
          set -euo pipefail
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          git ls-files --error-unmatch gradle/wrapper/gradle-wrapper.jar >/dev/null
          sha256sum gradle/wrapper/gradle-wrapper.jar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        shell: bash
        run: |
          mkdir -p ci-reports
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --stacktrace \
            --warning-mode all \
            --console=plain 2>&1 | tee ci-reports/unit_test_log.txt

      - name: Lint
        shell: bash
        run: |
          mkdir -p ci-reports
          set -o pipefail
          ./gradlew --no-daemon :app:lintDebug \
            --stacktrace \
            --warning-mode all \
            --console=plain 2>&1 | tee ci-reports/lint_log.txt

      - name: Assemble debug
        shell: bash
        run: |
          mkdir -p ci-reports
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug \
            --stacktrace \
            --warning-mode all \
            --console=plain 2>&1 | tee ci-reports/debug_build_log.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: NekoFlash-${{ github.sha }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: NekoFlash-${{ github.sha }}-reports
          path: |
            ci-reports/*.txt
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.txt
          if-no-files-found: ignore
          retention-days: 30
